name: SecQuest CI

on:
  pull_request:
  push:
    branches: ["**"]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # Never inject deployment secrets. Unit tests allocate synthetic databases;
      # this fallback and both E2E servers also use disposable runner storage.
      DATABASE_URL: ""
      TEST_DATABASE_URL: ""
      SMTP_URL: ""
      APP_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
    steps:
      - name: Set disposable database fallback
        run: echo "SQLITE_PATH=$RUNNER_TEMP/secquest-ci-fallback.sqlite" >> "$GITHUB_ENV"
      - name: Check out reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests (synthetic SQLite)
        run: npm test
      - name: Validate bundled content
        run: npm run content:validate
      - name: Production build
        run: npm run build
      - name: Typecheck (including generated Next route types)
        run: npm run typecheck

      # Sequential: the two configs share Next development build output.
      - name: HTTP workflows (isolated local server)
        run: npm run test:e2e:api
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Desktop and mobile workflows (isolated local server)
        run: npm run test:e2e

  pages-package:
    name: Package project guide
    needs: validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.event.repository.default_branch == 'master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require protected release branch
        shell: bash
        run: |
          if [ "$GITHUB_REF_PROTECTED" != "true" ]; then
            echo "::error::Pages publication requires protected master. Configure required PR review and the Validation check before publishing; see docs/DEPLOYMENT.md."
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check public artifact boundary
        shell: bash
        run: |
          test -f site/index.html && test -f site/style.css
          if find site -type l | grep -q .; then
            echo "Pages must not contain symbolic links." >&2
            exit 1
          fi
          if find site -type f ! -name index.html ! -name style.css | grep -q .; then
            echo "Only the reviewed project guide HTML/CSS may be published." >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  pages-deploy:
    name: Publish project guide
    needs: pages-package
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.event.repository.default_branch == 'master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed guide
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
